<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
<!-- FreeKmusic mockup icon set. 24x24, outline 1.75, round caps. One meaning per icon (F-02..F-05, F-12). -->
<symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11.2 12 4l8 7.2V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></symbol>
<symbol id="i-library" viewBox="0 0 24 24"><rect x="4" y="4" width="4" height="16" rx="1"/><rect x="10" y="4" width="4" height="16" rx="1"/><path d="m16.3 6.2 3.6-1 2 14-3.7 1z" transform="translate(-1.6 0)"/></symbol>
<symbol id="i-storage" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="4.5" rx="1.2"/><rect x="4" y="9.8" width="16" height="4.5" rx="1.2"/><rect x="4" y="15.6" width="16" height="4.5" rx="1.2"/></symbol>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.500 15.400 12 20 12 20z"/></symbol>
<symbol id="i-heart-fill" viewBox="0 0 24 24"><path fill="currentColor" d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.500 15.400 12 20 12 20z"/></symbol>
<!-- Coda: la lista che suona (righe + triangolo play) -->
<symbol id="i-queue" viewBox="0 0 24 24"><path d="M4 6.500h11M4 11.500h7M4 16.500h7"/><path d="M15.500 12.500v7l5.500-3.500z" fill="currentColor" stroke-width="1.2"/></symbol>
<!-- Aggiungi in coda: righe + "+" -->
<symbol id="i-queue-add" viewBox="0 0 24 24"><path d="M4 6.500h11M4 11.500h7M4 16.500h6"/><path d="M17 12.500v8M13 16.500h8"/></symbol>
<!-- Riproduci dopo: la prima riga della lista ha il play, con freccia in avanti -->
<symbol id="i-play-next" viewBox="0 0 24 24"><path d="M4 4.500v6l5-3z" fill="currentColor" stroke-width="1.2"/><path d="M12.500 7.500H20M16.500 4.500l3.500 3-3.500 3"/><path d="M4 15.500h16M4 20h10"/></symbol>
<!-- Aggiungi alla libreria: segnalibro con "+" -->
<symbol id="i-library-add" viewBox="0 0 24 24"><path d="M6.500 3.500h11a1 1 0 0 1 1 1V20.500l-6.500-4-6.500 4V4.500a1 1 0 0 1 1-1z"/><path d="M12 7.500v5M9.500 10h5"/></symbol>
<!-- Nella libreria: segnalibro con spunta -->
<symbol id="i-library-check" viewBox="0 0 24 24"><path d="M6.500 3.500h11a1 1 0 0 1 1 1V20.500l-6.500-4-6.500 4V4.500a1 1 0 0 1 1-1z"/><path d="m9.200 10 2 2 3.600-3.800"/></symbol>
<!-- Playlist: righe + nota -->
<symbol id="i-playlist" viewBox="0 0 24 24"><path d="M4 6.500h12M4 11.500h8M4 16.500h6"/><circle cx="16.800" cy="17.200" r="2.400"/><path d="M19.200 17.200V9l3 1.500"/></symbol>
<symbol id="i-playlist-add" viewBox="0 0 24 24"><path d="M4 6.500h8M4 11.500h6M4 16.500h4"/><path d="M17.500 3.500v6M14.500 6.500h6"/><circle cx="14" cy="17.500" r="2.300"/><path d="M16.300 17.500v-5"/></symbol>
<!-- Scarica per ascoltare offline: freccia in cerchio -->
<symbol id="i-download" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.500"/><path d="M12 7.500v7.500M8.800 12 12 15.200 15.200 12"/></symbol>
<!-- Salva file / Esporta: foglio con freccia in basso -->
<symbol id="i-file-save" viewBox="0 0 24 24"><path d="M14 3.500H7a1.500 1.500 0 0 0-1.500 1.500v14A1.500 1.500 0 0 0 7 20.500h10a1.500 1.500 0 0 0 1.500-1.500V8z"/><path d="M14 3.500V8h4.500"/><path d="M12 11.500v5M9.800 14.500l2.200 2.200 2.200-2.200"/></symbol>
<symbol id="i-share" viewBox="0 0 24 24"><circle cx="17.500" cy="5.500" r="2.500"/><circle cx="6.500" cy="12" r="2.500"/><circle cx="17.500" cy="18.500" r="2.500"/><path d="m8.700 10.800 6.600-4M8.700 13.200l6.600 4"/></symbol>
<symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5.500" r="1.700" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.700" fill="currentColor" stroke="none"/><circle cx="12" cy="18.500" r="1.700" fill="currentColor" stroke="none"/></symbol>
<!-- Jam: due persone che ascoltano insieme -->
<symbol id="i-jam" viewBox="0 0 24 24"><circle cx="8.500" cy="8.500" r="3"/><path d="M3 19.500c0-3.200 2.500-5.500 5.500-5.500s5.500 2.300 5.500 5.500"/><circle cx="16.800" cy="9.500" r="2.400"/><path d="M16.500 14.200c2.700 0 4.500 1.900 4.500 4.600"/></symbol>
<symbol id="i-radio" viewBox="0 0 24 24"><rect x="3.500" y="8.500" width="17" height="11" rx="2"/><path d="m8 8.500 9-4.500"/><circle cx="9" cy="14" r="2.500"/><path d="M14.500 12.500h3.500M14.500 15.500h3.500"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M8 5.200v13.600a.8.8 0 0 0 1.200.7l10.500-6.800a.8.8 0 0 0 0-1.400L9.200 4.500A.8.8 0 0 0 8 5.200z"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.500" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/><rect x="13.500" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-prev" viewBox="0 0 24 24"><path d="M6.500 5.500v13" /><path fill="currentColor" d="M18 6v12l-8.500-6z"/></symbol>
<symbol id="i-next" viewBox="0 0 24 24"><path d="M17.500 5.500v13"/><path fill="currentColor" d="M6 6v12l8.500-6z"/></symbol>
<symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M4 7h3.500c3.500 0 5 10 9 10H20M4 17h3.500c1.500 0 2.500-1.800 3.500-3.800M13.500 8.800C14.500 7.800 15.500 7 17 7h3"/><path d="m18 4.500 2.500 2.500L18 9.500M18 14.500l2.500 2.500-2.500 2.500"/></symbol>
<symbol id="i-repeat" viewBox="0 0 24 24"><path d="M5 11V9.500A2.500 2.500 0 0 1 7.500 7H19M19 7l-2.500-2.500M19 7l-2.500 2.500M19 13v1.500a2.500 2.500 0 0 1-2.500 2.500H5M5 17l2.500-2.500M5 17l2.500 2.500"/></symbol>
<symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9.500v5h3.500L12 18.500v-13L7.500 9.500z"/><path d="M15.500 9.500a3.500 3.500 0 0 1 0 5M18 7a7 7 0 0 1 0 10"/></symbol>
<symbol id="i-lyrics" viewBox="0 0 24 24"><path d="M5 4.500h14a1.500 1.500 0 0 1 1.500 1.500v9.500a1.500 1.500 0 0 1-1.500 1.500h-7.500L7 20.500V17H5a1.500 1.500 0 0 1-1.500-1.500V6A1.500 1.500 0 0 1 5 4.500z"/><path d="M8 9h8M8 12.500h5"/></symbol>
<symbol id="i-devices" viewBox="0 0 24 24"><rect x="3.500" y="5.500" width="12" height="9" rx="1.500"/><path d="M2.500 18.500h14"/><rect x="17.500" y="9" width="4" height="9.500" rx="1"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.300" stroke-width="3" stroke-dasharray="2.300 3.600"/><circle cx="12" cy="12" r="6.200"/><circle cx="12" cy="12" r="2.500"/></symbol>
<symbol id="i-receipt" viewBox="0 0 24 24"><path d="M6 3.500h12v17l-2.200-1.500-1.900 1.500-1.900-1.500-1.900 1.500L8.200 19 6 20.500z"/><path d="M9 8h6M9 12h6M9 16h3"/></symbol>
<symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9.500 5.500 6.500 6.500-6.500 6.500"/></symbol>
<symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m14.500 5.500-6.500 6.500 6.500 6.500"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 5.500 4.500 12l6.500 6.500"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.500 4.500 4.500L19 7.500"/></symbol>
<symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M10 4.500 11.700 10 17.500 11.700 11.700 13.400 10 19 8.300 13.400 2.500 11.700 8.300 10z" transform="translate(2 0)"/></symbol>
<symbol id="i-disc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.500"/><circle cx="12" cy="12" r="2.200"/></symbol>
<symbol id="i-sort" viewBox="0 0 24 24"><path d="M8 5v14M4.800 8.200 8 5l3.200 3.200M16 19V5M12.800 15.800 16 19l3.200-3.200"/></symbol>
<symbol id="i-activity" viewBox="0 0 24 24"><path d="M3.500 12h4l2.500-6 4 12 2.500-6h4"/></symbol>
<symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3.500" y="4.500" width="17" height="15" rx="2"/><path d="M9.500 4.500v15"/></symbol>
</svg>
