app-id: com.freekmusic.player
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: freekmusic
finish-args:
  - --share=network        # downloads, local-network share and Jam (UDP discovery included)
  - --share=ipc
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-music
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.Notifications
  - --own-name=org.mpris.MediaPlayer2.freekmusic   # media keys and the desktop's player widget
modules:
  # mpv 0.38 needs libplacebo >= 6.338.2, which the 24.08 runtime does not ship.
  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Ddemos=false
      - -Dtests=false
      - -Dvulkan=disabled
      - -Dd3d11=disabled
      - -Dlcms=disabled
      - -Dshaderc=disabled
      - -Dglslang=disabled
    sources:
      - type: git
        url: https://code.videolan.org/videolan/libplacebo.git
        tag: v6.338.2
        commit: 64c1954570f1cd57f8570a57e51fb0249b57bb90

  - name: libass
    buildsystem: autotools
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.3/libass-0.17.3.tar.xz
        sha256: eae425da50f0015c21f7b3a9c7262a910f0218af469e22e2931462fed3c50959

  - name: libmpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dlua=disabled
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.38.0.tar.gz
        sha256: 86d9ef40b6058732f67b46d0bbda24a074fae860b3eaae05bab3145041303066
    # ffmpeg comes from the runtime extension below.

  - name: yt-dlp
    buildsystem: simple
    build-commands:
      - install -Dm755 yt-dlp /app/bin/yt-dlp
    sources:
      - type: file
        url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.08.19/yt-dlp_linux
        dest-filename: yt-dlp
        sha256: 58162f9bfdc27458ea47bfcb311cf47028f17d8154a8bf7d689861d46399230a

  - name: freekmusic
    buildsystem: simple
    build-commands:
      - mkdir -p /app/freekmusic /app/bin /app/share/applications /app/share/metainfo /app/share/icons/hicolor/512x512/apps
      - cp -r bundle/* /app/freekmusic/
      - ln -s /app/freekmusic/freekmusic /app/bin/freekmusic
      - install -Dm644 com.freekmusic.player.desktop /app/share/applications/com.freekmusic.player.desktop
      - install -Dm644 com.freekmusic.player.metainfo.xml /app/share/metainfo/com.freekmusic.player.metainfo.xml
      - install -Dm644 icon-512.png /app/share/icons/hicolor/512x512/apps/com.freekmusic.player.png
    sources:
      # The release bundle built by the workflow (flutter build linux --release).
      - type: dir
        path: ../../build/linux/x64/release
        dest: .
      - type: file
        path: com.freekmusic.player.desktop
      - type: file
        path: com.freekmusic.player.metainfo.xml
      - type: file
        path: icon-512.png

add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    add-ld-path: .
    version: '24.08'
    autodownload: true
    autodelete: false
