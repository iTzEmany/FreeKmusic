name: Release

# Runs when a tag v* is pushed: builds every package and attaches them to a
# GitHub release. Nothing here runs on a pull request.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.1'

permissions:
  contents: write

jobs:
  linux:
    name: Linux (zip, .deb, AppImage)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev mpv libsqlite3-dev zip dpkg-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      - run: scripts/package-linux.sh --deb
      - run: scripts/package-appimage.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            build/freekmusic-linux-x64.zip
            build/freekmusic_*_amd64.deb
            build/freekmusic-*-x86_64.AppImage
          if-no-files-found: error

  flatpak:
    name: Flatpak
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 org.freedesktop.Platform.ffmpeg-full//24.08
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: dl
      - name: Release bundle from the zip
        run: |
          mkdir -p build/linux/x64/release
          unzip -q dl/freekmusic-linux-x64.zip -d dl/unzipped
          cp -r dl/unzipped/freekmusic build/linux/x64/release/bundle
      - name: Build the bundle
        run: |
          flatpak-builder --user --force-clean --repo=repo build-dir packaging/flatpak/com.freekmusic.player.yml
          flatpak build-bundle repo freekmusic.flatpak com.freekmusic.player
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: freekmusic.flatpak
          if-no-files-found: error

  android:
    name: Android (full and lite, one APK per ABI)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # The keystore comes from the repository secrets and is never printed. A release
      # without it would be signed by the runner's throwaway debug key, and phones
      # would refuse it as an update: fail instead.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_PASSWORD / ANDROID_KEY_ALIAS secrets missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEY_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties
      - name: Full (with yt-dlp)
        run: |
          flutter build apk --release --split-per-abi
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            cp "$f" "freekmusic-full-$(basename "$f" | sed 's/^app-//')"
          done
      - name: Lite (no downloads)
        env:
          CODECORE_LITE: '1'
        run: |
          flutter build apk --release --split-per-abi --dart-define=CODECORE_YOUTUBE=false
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            cp "$f" "freekmusic-lite-$(basename "$f" | sed 's/^app-//')"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            freekmusic-full-arm64-v8a-release.apk
            freekmusic-full-armeabi-v7a-release.apk
            freekmusic-lite-arm64-v8a-release.apk
            freekmusic-lite-armeabi-v7a-release.apk
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - name: yt-dlp and ffmpeg (LGPL build) next to the app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\windows\tools\licenses | Out-Null
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/download/2026.08.19/yt-dlp.exe -OutFile build\windows\tools\yt-dlp.exe
          Invoke-WebRequest https://raw.githubusercontent.com/yt-dlp/yt-dlp/master/LICENSE -OutFile build\windows\tools\licenses\yt-dlp-LICENSE.txt
          # BtbN builds: the "lgpl" variant is ffmpeg without GPL parts.
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dir
          $root = Get-ChildItem ffmpeg-dir | Select-Object -First 1
          Copy-Item "$($root.FullName)\bin\ffmpeg.exe" build\windows\tools\ffmpeg.exe
          Copy-Item "$($root.FullName)\LICENSE.txt" build\windows\tools\licenses\ffmpeg-LICENSE.txt
          'ffmpeg source code: https://ffmpeg.org/ and https://github.com/BtbN/FFmpeg-Builds' | Out-File build\windows\tools\licenses\ffmpeg-SOURCE.txt
      - name: Installer
        shell: pwsh
        run: |
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\windows\freekmusic.iss
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: build/FreeKmusic-Setup-*.exe
          if-no-files-found: error

  macos:
    name: macOS (.app in zip, not signed)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release
      # Nothing extra is bundled (no yt-dlp/ffmpeg): downloads need them in the PATH.
      - name: Zip the .app
        run: |
          v=$(sed -n 's/^version:[[:space:]]*\([0-9.]*\).*/\1/p' pubspec.yaml)
          ditto -c -k --keepParent build/macos/Build/Products/Release/freekmusic.app "FreeKmusic-$v-macos.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: FreeKmusic-*-macos.zip
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: [linux, flatpak, android, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
